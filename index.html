<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gridlock</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 12px; top: 10px; color: #fff; font: 600 15px/1.4 system-ui, sans-serif; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #help { position: fixed; left: 12px; bottom: 10px; color: #ddd; font: 12px/1.4 system-ui, sans-serif; text-shadow: 0 1px 3px #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="help">Arrows / WASD: move &middot; E / Enter: get in or out of a car &middot; Space: handbrake</div>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), hud = document.getElementById('hud');
let cw, ch, dpr;
function resize() { dpr = Math.min(devicePixelRatio || 1, 2); cw = innerWidth; ch = innerHeight; cv.width = cw * dpr; cv.height = ch * dpr; }
addEventListener('resize', resize); resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let seed = 1337;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

// ---------- city ----------
const T = 64, P = 10, NB = 6, N = NB * P + 2; // tile px, block period, blocks, map tiles
const ROAD = 0, WALK = 1, BLD = 2, GRASS = 3;
const map = new Uint8Array(N * N);
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
  map[y * N + x] = (x % P < 2 || y % P < 2) ? ROAD : WALK;

const ROOFS = ['#8a8f98', '#9b8b7a', '#7d8a7a', '#a3a09a', '#8c7f8f', '#b09a80', '#7f8c9c'];
const blds = [];
function addB(x0, y0, w, h) {
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) map[y * N + x] = BLD;
  blds.push({ x: x0 * T, y: y0 * T, w: w * T, h: h * T, ht: 0.12 + rnd() * 0.25,
    c: ROOFS[rnd() * ROOFS.length | 0], bu: 0.2 + rnd() * 0.5, bv: 0.2 + rnd() * 0.5 });
}
for (let j = 0; j < NB; j++) for (let i = 0; i < NB; i++) {
  const x0 = i * P + 3, y0 = j * P + 3, r = rnd();
  if (r < 0.12) { for (let y = y0; y < y0 + 6; y++) for (let x = x0; x < x0 + 6; x++) map[y * N + x] = GRASS; }
  else if (r < 0.45) addB(x0, y0, 6, 6);
  else if (r < 0.7) { addB(x0, y0, 3, 6); addB(x0 + 4, y0, 2, 6); }
  else { addB(x0, y0, 6, 3); addB(x0, y0 + 4, 6, 2); }
}
const tileAt = (tx, ty) => (tx < 0 || ty < 0 || tx >= N || ty >= N) ? BLD : map[ty * N + tx];
const solid = (px, py) => tileAt(Math.floor(px / T), Math.floor(py / T)) === BLD;

// ---------- cars ----------
const CAR_COLORS = ['#c0392b', '#2e86de', '#f1c40f', '#27ae60', '#ecf0f1', '#8e44ad', '#e67e22', '#2c3e50', '#16a085'];
const cars = [];
function makeCar(x, y, a) { return { x, y, a, vx: 0, vy: 0, hl: 24, hw: 13, col: CAR_COLORS[rnd() * CAR_COLORS.length | 0] }; }
function carPoints(x, y, a, hl, hw) {
  const fx = Math.cos(a), fy = Math.sin(a), rx = -fy, ry = fx, pts = [];
  for (const s of [1, 0, -1]) for (const t of [1, -1]) pts.push([x + fx * hl * s + rx * hw * t, y + fy * hl * s + ry * hw * t]);
  return pts;
}
function hitWorld(c, x, y, a) { for (const p of carPoints(x, y, a, c.hl, c.hw)) if (solid(p[0], p[1])) return true; return false; }

// parked cars on the right-hand lane of each road
function laneAngle(tx, ty) {
  const h = ty % P < 2, v = tx % P < 2;
  if (h && !v) return ty % P === 0 ? Math.PI : 0;
  if (v && !h) return tx % P === 0 ? Math.PI / 2 : -Math.PI / 2;
  return null; // intersection
}
const startX = (3 * P + 2) * T + T / 2, startY = (3 * P + 5) * T + T / 2;
cars.push(makeCar((3 * P + 1) * T + T / 2, startY, -Math.PI / 2));
for (let tries = 0; cars.length < 40 && tries < 5000; tries++) {
  const tx = rnd() * N | 0, ty = rnd() * N | 0;
  if (tileAt(tx, ty) !== ROAD) continue;
  const a = laneAngle(tx, ty); if (a === null) continue;
  const x = tx * T + T / 2, y = ty * T + T / 2;
  if (cars.every(c => Math.hypot(c.x - x, c.y - y) > 90)) cars.push(makeCar(x, y, a));
}

function updateCar(c, dt, inp) {
  const fx = Math.cos(c.a), fy = Math.sin(c.a), rx = -fy, ry = fx;
  let vf = c.vx * fx + c.vy * fy, vr = c.vx * rx + c.vy * ry;
  const th = inp ? inp.th : 0, st = inp ? inp.st : 0, hb = inp ? inp.hb : false;
  if (th > 0) vf += (vf < -5 ? 900 : 320) * dt;
  else if (th < 0) vf -= (vf > 5 ? 900 : 220) * dt;
  else vf -= Math.sign(vf) * Math.min(Math.abs(vf), 120 * dt);
  if (hb) vf -= Math.sign(vf) * Math.min(Math.abs(vf), 450 * dt);
  vf = clamp(vf, -170, 560);
  vr *= Math.exp(-(hb ? 1.2 : 10) * dt);
  const turn = st * 2.8 * clamp(vf / 120, -1, 1) * (1 - 0.35 * Math.min(Math.abs(vf) / 560, 1)) * (hb ? 1.5 : 1);
  c.vx = fx * vf + rx * vr; c.vy = fy * vf + ry * vr;
  const na = c.a + turn * dt;
  if (!hitWorld(c, c.x, c.y, na)) c.a = na;
  const nx = c.x + c.vx * dt; if (hitWorld(c, nx, c.y, c.a)) c.vx *= -0.3; else c.x = nx;
  const ny = c.y + c.vy * dt; if (hitWorld(c, c.x, ny, c.a)) c.vy *= -0.3; else c.y = ny;
}

function tryPush(c, ox, oy) { if (hitWorld(c, c.x + ox, c.y + oy, c.a)) return false; c.x += ox; c.y += oy; return true; }
function collideCars(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  if (dx * dx + dy * dy > 80 * 80) return;
  const pa = carPoints(a.x, a.y, a.a, a.hl, a.hw), pb = carPoints(b.x, b.y, b.a, b.hl, b.hw);
  const axes = [[Math.cos(a.a), Math.sin(a.a)], [-Math.sin(a.a), Math.cos(a.a)], [Math.cos(b.a), Math.sin(b.a)], [-Math.sin(b.a), Math.cos(b.a)]];
  let best = Infinity, nx = 0, ny = 0;
  for (const [ax, ay] of axes) {
    let amin = Infinity, amax = -Infinity, bmin = Infinity, bmax = -Infinity;
    for (const p of pa) { const d = p[0] * ax + p[1] * ay; amin = Math.min(amin, d); amax = Math.max(amax, d); }
    for (const p of pb) { const d = p[0] * ax + p[1] * ay; bmin = Math.min(bmin, d); bmax = Math.max(bmax, d); }
    const o = Math.min(amax - bmin, bmax - amin);
    if (o <= 0) return;
    if (o < best) { best = o; nx = ax; ny = ay; }
  }
  if (dx * nx + dy * ny < 0) { nx = -nx; ny = -ny; } // normal points a -> b
  const h = best / 2;
  const okA = tryPush(a, -nx * h, -ny * h), okB = tryPush(b, nx * h, ny * h);
  if (!okA) tryPush(b, nx * h, ny * h);
  if (!okB) tryPush(a, -nx * h, -ny * h);
  const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rv < 0) { const j = -1.3 * rv / 2; a.vx -= j * nx; a.vy -= j * ny; b.vx += j * nx; b.vy += j * ny; }
}

// ---------- player ----------
const pl = { x: startX, y: startY, a: -Math.PI / 2, r: 9, car: null, step: 0 };
function toLocal(c, x, y) { const dx = x - c.x, dy = y - c.y, fx = Math.cos(c.a), fy = Math.sin(c.a); return [dx * fx + dy * fy, -dx * fy + dy * fx]; }
const pSolid = (x, y) => solid(x - pl.r, y - pl.r) || solid(x + pl.r, y - pl.r) || solid(x - pl.r, y + pl.r) || solid(x + pl.r, y + pl.r);
function insideCar(x, y, pad) { return cars.some(c => { const [lx, ly] = toLocal(c, x, y); return Math.abs(lx) < c.hl + pad && Math.abs(ly) < c.hw + pad; }); }

function updatePlayer(dt, inp) {
  pl.a += inp.st * 4 * dt;
  const sp = inp.th > 0 ? 160 : inp.th < 0 ? -90 : 0;
  if (sp) pl.step += dt * 12;
  const nx = pl.x + Math.cos(pl.a) * sp * dt, ny = pl.y + Math.sin(pl.a) * sp * dt;
  if (!pSolid(nx, pl.y)) pl.x = nx;
  if (!pSolid(pl.x, ny)) pl.y = ny;
  // get shoved out of cars
  for (const c of cars) {
    const [lx, ly] = toLocal(c, pl.x, pl.y);
    const px = c.hl + pl.r - Math.abs(lx), py = c.hw + pl.r - Math.abs(ly);
    if (px <= 0 || py <= 0) continue;
    const fx = Math.cos(c.a), fy = Math.sin(c.a);
    let ox, oy;
    if (px < py) { const s = Math.sign(lx) || 1; ox = fx * px * s; oy = fy * px * s; }
    else { const s = Math.sign(ly) || 1; ox = -fy * py * s; oy = fx * py * s; }
    if (!pSolid(pl.x + ox, pl.y + oy)) { pl.x += ox; pl.y += oy; }
  }
}

function toggleCar() {
  if (pl.car) {
    const c = pl.car, fx = Math.cos(c.a), fy = Math.sin(c.a), rx = -fy, ry = fx;
    const d = c.hw + pl.r + 4, e = c.hl + pl.r + 4;
    for (const [ox, oy] of [[-rx * d, -ry * d], [rx * d, ry * d], [-fx * e, -fy * e], [fx * e, fy * e]]) {
      const x = c.x + ox, y = c.y + oy;
      if (!pSolid(x, y) && !insideCar(x, y, pl.r)) { pl.x = x; pl.y = y; pl.a = c.a; pl.car = null; return; }
    }
    return; // boxed in
  }
  let best = null, bd = 22;
  for (const c of cars) {
    const [lx, ly] = toLocal(c, pl.x, pl.y);
    const d = Math.hypot(Math.max(Math.abs(lx) - c.hl, 0), Math.max(Math.abs(ly) - c.hw, 0));
    if (d < bd) { bd = d; best = c; }
  }
  if (best) pl.car = best;
}

// ---------- input ----------
const keys = {};
let wantToggle = false;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code === 'KeyE' || e.code === 'KeyF' || e.code === 'Enter') && !e.repeat) wantToggle = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const readInput = () => ({
  th: (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0),
  st: (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0),
  hb: !!keys.Space,
});

// ---------- simulation ----------
const cam = { x: startX, y: startY, z: 1 };
function step(dt) {
  const inp = readInput();
  if (wantToggle) { wantToggle = false; toggleCar(); }
  for (const c of cars) updateCar(c, dt, c === pl.car ? inp : null);
  for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) collideCars(cars[i], cars[j]);
  if (pl.car) { pl.x = pl.car.x; pl.y = pl.car.y; } else updatePlayer(dt, inp);

  const c = pl.car, speed = c ? Math.hypot(c.vx, c.vy) : 0;
  const tx = c ? c.x + c.vx * 0.35 : pl.x, ty = c ? c.y + c.vy * 0.35 : pl.y;
  const k = 1 - Math.exp(-5 * dt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  const zt = Math.min(cw, ch) / 750 * (1 - 0.3 * Math.min(speed / 560, 1));
  cam.z += (zt - cam.z) * (1 - Math.exp(-2 * dt));
}

// ---------- rendering ----------
const TILE_COL = ['#3a3d42', '#9a968c', '#2a2a2e', '#4f7a3a'];
function drawCar(c) {
  ctx.save(); ctx.translate(c.x + 4, c.y + 5); ctx.rotate(c.a);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-c.hl, -c.hw, c.hl * 2, c.hw * 2);
  ctx.restore();
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.a);
  const L = c.hl, W = c.hw;
  ctx.fillStyle = c.col; ctx.beginPath(); ctx.roundRect(-L, -W, L * 2, W * 2, 6); ctx.fill();
  ctx.fillStyle = '#1b2430';
  ctx.fillRect(L * 0.1, -W + 3, L * 0.4, W * 2 - 6);   // windshield
  ctx.fillRect(-L * 0.8, -W + 3, L * 0.3, W * 2 - 6);  // rear window
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(-L * 0.5, -W + 3, L * 0.6, W * 2 - 6); // roof
  ctx.fillStyle = '#ffe9a8'; ctx.fillRect(L - 3, -W + 2, 3, 4); ctx.fillRect(L - 3, W - 6, 3, 4);
  ctx.fillStyle = '#b3201b'; ctx.fillRect(-L, -W + 2, 2, 4); ctx.fillRect(-L, W - 6, 2, 4);
  ctx.restore();
}
function drawPlayer() {
  ctx.save(); ctx.translate(pl.x, pl.y); ctx.rotate(pl.a);
  const s = Math.sin(pl.step) * 5;
  ctx.fillStyle = '#222'; ctx.fillRect(s - 3, -6, 6, 4); ctx.fillRect(-s - 3, 2, 6, 4); // feet
  ctx.fillStyle = '#2c5aa0'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5a3a22'; ctx.beginPath(); ctx.arc(1, 0, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
const WALL = ['#4a4a52', '#3c3c44', '#5a5a62', '#44444c']; // N, E, S, W walls
function drawBuilding(b) {
  const k = 1 + b.ht, sx = cam.x, sy = cam.y;
  const B = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]];
  const R = B.map(([x, y]) => [sx + (x - sx) * k, sy + (y - sy) * k]);
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    ctx.fillStyle = WALL[i]; ctx.beginPath();
    ctx.moveTo(B[i][0], B[i][1]); ctx.lineTo(B[j][0], B[j][1]); ctx.lineTo(R[j][0], R[j][1]); ctx.lineTo(R[i][0], R[i][1]);
    ctx.fill();
  }
  const rx = R[0][0], ry = R[0][1], rw = R[1][0] - rx, rh = R[3][1] - ry;
  ctx.fillStyle = b.c; ctx.fillRect(rx, ry, rw, rh);
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 6; ctx.strokeRect(rx + 3, ry + 3, rw - 6, rh - 6);
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(rx + rw * b.bu, ry + rh * b.bv, 40, 28); // rooftop unit
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0d0f12'; ctx.fillRect(0, 0, cv.width, cv.height);
  const s = dpr * cam.z;
  ctx.setTransform(s, 0, 0, s, cv.width / 2 - cam.x * s, cv.height / 2 - cam.y * s);
  const vw = cw / 2 / cam.z, vh = ch / 2 / cam.z;
  const x0 = Math.max(0, Math.floor((cam.x - vw) / T)), x1 = Math.min(N - 1, Math.floor((cam.x + vw) / T));
  const y0 = Math.max(0, Math.floor((cam.y - vh) / T)), y1 = Math.min(N - 1, Math.floor((cam.y + vh) / T));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const t = map[y * N + x];
    ctx.fillStyle = TILE_COL[t]; ctx.fillRect(x * T, y * T, T + 0.5, T + 0.5);
    if (t === ROAD) {
      ctx.fillStyle = '#d8c25a';
      if (y % P === 0 && x % P >= 2) ctx.fillRect(x * T + 8, y * T + T - 2, 28, 4);
      if (x % P === 0 && y % P >= 2) ctx.fillRect(x * T + T - 2, y * T + 8, 4, 28);
    } else if (t === WALK) {
      ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 2; ctx.strokeRect(x * T + 1, y * T + 1, T - 2, T - 2);
    }
  }
  for (const c of cars) if (Math.abs(c.x - cam.x) < vw + 60 && Math.abs(c.y - cam.y) < vh + 60) drawCar(c);
  if (!pl.car) drawPlayer();
  const vis = blds.filter(b => b.x < cam.x + vw + 200 && b.x + b.w > cam.x - vw - 200 && b.y < cam.y + vh + 200 && b.y + b.h > cam.y - vh - 200);
  const dist = b => Math.hypot(b.x + b.w / 2 - cam.x, b.y + b.h / 2 - cam.y);
  vis.sort((a, b) => dist(b) - dist(a)).forEach(drawBuilding);

  const txt = pl.car ? `Driving · ${Math.round(Math.hypot(pl.car.vx, pl.car.vy) * 0.25)} km/h` : 'On foot';
  if (hud.textContent !== txt) hud.textContent = txt;
}

// ---------- loop ----------
const DT = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min((now - last) / 1000, 0.1); last = now;
  while (acc >= DT) { step(DT); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
